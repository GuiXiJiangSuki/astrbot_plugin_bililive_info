<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>监听转发</title>
<style>
  :root {
    --bg: #0e1116;
    --card: #161b22;
    --card-2: #1c222b;
    --line: #262d38;
    --text: #e6edf3;
    --sub: #8b949e;
    --faint: #5c6672;
    --brand: #ff9ecd;
    --ok: #3fb950;
    --err: #f85149;
    --warn: #d29922;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    padding: 22px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", Roboto, sans-serif;
    color: var(--text);
    background: var(--bg);
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }

  .head { margin-bottom: 18px; }
  .head h1 { font-size: 18px; font-weight: 650; letter-spacing: .2px; }
  .head p { margin-top: 6px; font-size: 12px; color: var(--sub); line-height: 1.6; }

  .toolbar {
    display: flex; align-items: center; gap: 10px;
    margin: 16px 0 14px;
  }
  .btn {
    border: 1px solid var(--line); background: var(--card-2); color: var(--text);
    border-radius: 8px; padding: 7px 14px; font-size: 12.5px; font-family: inherit;
    cursor: pointer; transition: .16s;
  }
  .btn:hover { background: #232b36; border-color: #333d4a; }
  .btn.primary { background: rgba(255,158,205,.14); border-color: rgba(255,158,205,.34); color: var(--brand); }
  .btn.primary:hover { background: rgba(255,158,205,.22); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .empty {
    padding: 46px 20px; text-align: center;
    border: 1px dashed var(--line); border-radius: 12px;
    color: var(--faint); line-height: 1.9;
  }
  .empty b { display: block; color: var(--sub); font-size: 13.5px; margin-bottom: 6px; }
  .empty code {
    background: var(--card-2); padding: 2px 7px; border-radius: 5px;
    color: var(--brand); font-size: 12px;
  }

  .group {
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--card); margin-bottom: 14px; overflow: hidden;
  }
  .group-head {
    display: flex; align-items: center; gap: 10px;
    padding: 13px 16px; border-bottom: 1px solid var(--line);
    background: var(--card-2);
  }
  .group-head .ico { font-size: 15px; }
  .group-head .gid {
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 11.5px; color: var(--sub); word-break: break-all;
  }
  .group-head .cnt {
    margin-left: auto; font-size: 11.5px; color: var(--faint);
    background: rgba(255,255,255,.04); padding: 3px 9px; border-radius: 20px;
  }

  .row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; border-bottom: 1px solid rgba(38,45,56,.55);
  }
  .row:last-child { border-bottom: 0; }
  .row:hover { background: rgba(255,255,255,.017); }

  .face {
    width: 34px; height: 34px; border-radius: 50%; flex: 0 0 34px;
    object-fit: cover; background: var(--card-2);
    border: 1px solid var(--line);
  }
  .face-ph {
    width: 34px; height: 34px; border-radius: 50%; flex: 0 0 34px;
    display: grid; place-items: center;
    background: var(--card-2); border: 1px solid var(--line);
    color: var(--faint); font-size: 15px;
  }

  .who { min-width: 0; flex: 1; }
  .who .nm { font-size: 13px; font-weight: 600; }
  .who .sub { font-size: 11.5px; color: var(--faint); margin-top: 2px; }
  .who .sub code {
    font-family: ui-monospace, Consolas, monospace;
    background: rgba(255,255,255,.045); padding: 1px 5px; border-radius: 4px;
  }

  .state {
    font-size: 11px; padding: 3px 9px; border-radius: 20px;
    border: 1px solid transparent; white-space: nowrap;
  }
  .state.live { color: var(--ok); background: rgba(63,185,80,.12); border-color: rgba(63,185,80,.28); }
  .state.conn { color: var(--ok); background: rgba(63,185,80,.08); border-color: rgba(63,185,80,.2); }
  .state.off  { color: var(--faint); background: rgba(255,255,255,.03); border-color: var(--line); }

  .price-box {
    display: flex; align-items: center; gap: 5px; flex: 0 0 auto;
  }
  .price-box label { font-size: 11px; color: var(--faint); white-space: nowrap; }
  .price-in {
    width: 62px; padding: 5px 7px; font-size: 12px; font-family: inherit;
    background: var(--card-2); border: 1px solid var(--line); border-radius: 7px;
    color: var(--text); text-align: right;
  }
  .price-in:focus { outline: 0; border-color: rgba(255,158,205,.5); }
  .price-in.dirty { border-color: rgba(255,158,205,.65); background: rgba(255,158,205,.07); }
  .price-save {
    border: 1px solid rgba(255,158,205,.34); background: rgba(255,158,205,.12);
    color: var(--brand); border-radius: 7px; padding: 5px 10px;
    font-size: 11.5px; font-family: inherit; cursor: pointer; transition: .16s;
  }
  .price-save:hover { background: rgba(255,158,205,.22); }
  .price-save:disabled { opacity: .4; cursor: not-allowed; }

  .del {
    border: 1px solid rgba(248,81,73,.28); background: rgba(248,81,73,.1);
    color: var(--err); border-radius: 7px; padding: 5px 11px;
    font-size: 11.5px; font-family: inherit; cursor: pointer; transition: .16s;
    flex: 0 0 auto;
  }
  .del:hover { background: rgba(248,81,73,.2); }
  .del.armed {
    background: rgba(248,81,73,.32); border-color: rgba(248,81,73,.8);
    color: #fff; font-weight: 700;
  }
  .del:disabled { opacity: .4; cursor: not-allowed; }

  .foot {
    margin-top: 18px; font-size: 11.5px; color: var(--faint); line-height: 1.9;
  }
  .foot code {
    background: var(--card-2); padding: 2px 7px; border-radius: 5px; color: var(--brand);
  }

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(12px);
    background: var(--card-2); border: 1px solid var(--line);
    padding: 9px 18px; border-radius: 9px; font-size: 12.5px;
    opacity: 0; pointer-events: none; transition: .22s;
    box-shadow: 0 8px 26px rgba(0,0,0,.5);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.ok { border-color: rgba(63,185,80,.4); color: #7ee787; }
  .toast.err { border-color: rgba(248,81,73,.4); color: #ff9b95; }
</style>
</head>
<body>
  <div class="head">
    <h1>监听转发</h1>
    <p>汐汐工具箱的直播间事件（礼物 / 醒目留言 / 盲盒 / 上舰）会实时转发到对应群。</p>
  </div>

  <div class="toolbar">
    <button class="btn" id="refresh">刷新</button>
    <button class="btn" id="copy-all">复制全部群号</button>
    <span id="meta" style="font-size:11.5px;color:var(--faint)"></span>
  </div>

  <div id="list"></div>

  <div class="foot">
    添加：在群里发 <code>/添加监听转发 &lt;房间号&gt;</code><br />
    撤销：在群里发 <code>/撤销监听转发 &lt;房间号&gt;</code>，或用上面的删除按钮
  </div>

  <div class="toast" id="toast"></div>

<script type="module">
const bridge = window.AstrBotPluginPage || {};
const $ = (s) => document.querySelector(s);

function toast(msg, kind) {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'toast show ' + (kind || '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.className = 'toast'; }, 2400);
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function fmtTime(ms) {
  if (!ms) return '';
  const d = new Date(ms);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function unwrap(r) { return r && r.data ? r.data : r; }

async function apiGet(path) {
  if (bridge.apiGet) return unwrap(await bridge.apiGet(path));
  if (bridge.apiRequest) return unwrap(await bridge.apiRequest(path, { method: 'GET' }));
  // 退化：直连（AstrBot 的 web 端口也会代理插件路由）
  const r = await fetch('/api/plug/astrbot_plugin_bililive_info/' + path);
  return unwrap(await r.json());
}

async function apiPost(path, data) {
  if (bridge.apiPost) return unwrap(await bridge.apiPost(path, data));
  if (bridge.apiRequest) return unwrap(await bridge.apiRequest(path, { method: 'POST', data }));
  const r = await fetch('/api/plug/astrbot_plugin_bililive_info/' + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data || {}),
  });
  return unwrap(await r.json());
}

let current = { groups: [], total: 0, prefix: true, giftMin: 0 };

function render() {
  const box = $('#list');
  const groups = current.groups || [];

  if (!groups.length) {
    box.innerHTML = `
      <div class="empty">
        <b>还没有配置任何转发</b>
        到 QQ 群里发 <code>/添加监听转发 &lt;房间号&gt;</code> 就能开启<br />
        例：<code>/添加监听转发 52030</code>
      </div>`;
    return;
  }

  box.innerHTML = groups.map((g) => {
    const rooms = g.rooms || [];
    return `
      <div class="group">
        <div class="group-head">
          <span class="ico">👥</span>
          <span class="gid">群 ${esc(g.group)}</span>
          <span class="cnt">${rooms.length} 个直播间</span>
        </div>
        ${rooms.map((r) => {
          const name = r.alias || r.anchor || ('房间 ' + r.roomId);
          const subBits = [];
          if (r.anchor && r.anchor !== name) subBits.push(esc(r.anchor));
          subBits.push(`<code>${r.roomId}</code>`);
          if (r.addedAt) subBits.push(fmtTime(r.addedAt) + ' 添加');

          const liveTag = r.live
            ? '<span class="state live">● 直播中</span>'
            : (r.state === 'open'
              ? '<span class="state conn">● 已连接</span>'
              : '<span class="state off">未开播</span>');

          return `
            <div class="row">
              ${r.face
                ? `<img class="face" src="${esc(r.face)}" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=\\'face-ph\\'>🎭</div>'" />`
                : '<div class="face-ph">🎭</div>'}
              <div class="who">
                <div class="nm">${esc(name)}</div>
                <div class="sub">${subBits.join(' · ')}</div>
              </div>
              ${liveTag}
              <div class="price-box">
                <label>≥¥</label>
                <input class="price-in" type="number" min="0" step="0.1"
                       value="${(r.minPrice || 0)}"
                       data-group="${esc(g.group)}" data-room="${r.roomId}"
                       title="低于这个金额的礼物不转发，0 = 不限制" />
                <button class="price-save" style="display:none"
                        data-group="${esc(g.group)}" data-room="${r.roomId}">保存</button>
              </div>
              <button class="del" data-group="${esc(g.group)}" data-room="${r.roomId}">删除</button>
            </div>`;
        }).join('')}
      </div>`;
  }).join('');

  // ── 金额门槛：改动即显示保存按钮 ──
  box.querySelectorAll('.price-in').forEach((inp) => {
    const gid = inp.getAttribute('data-group');
    const rid = Number(inp.getAttribute('data-room'));
    const saveBtn = box.querySelector(`.price-save[data-group="${gid}"][data-room="${rid}"]`);
    const orig = inp.value;

    inp.addEventListener('input', () => {
      const changed = String(inp.value) !== String(orig);
      inp.classList.toggle('dirty', changed);
      if (saveBtn) saveBtn.style.display = changed ? '' : 'none';
    });

    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && saveBtn && saveBtn.style.display !== 'none') saveBtn.click();
    });

    if (saveBtn) {
      saveBtn.addEventListener('click', async () => {
        const val = Number(inp.value) || 0;
        if (val < 0) return toast('金额不能为负数', 'err');
        saveBtn.disabled = true;
        try {
          const r = await apiPost('relay-min-price', { group: gid, roomId: rid, minPrice: val });
          if (r && r.success === false) throw new Error(r.message || '保存失败');
          toast(val > 0 ? `已设置：低于 ¥${val} 的礼物不转发` : '已取消金额限制', 'ok');
          await load();
        } catch (e) {
          toast('保存失败：' + e.message, 'err');
          saveBtn.disabled = false;
        }
      });
    }
  });

  // ── 删除：二次点击确认（不用 confirm —— 在 AstrBot 的 iframe 里可能被拦截）──
  box.querySelectorAll('.del').forEach((btn) => {
    let armed = false;
    let timer = null;

    const reset = () => {
      armed = false;
      btn.textContent = '删除';
      btn.classList.remove('armed');
      if (timer) { clearTimeout(timer); timer = null; }
    };

    btn.addEventListener('click', async () => {
      // 第一次点：变成「确认删除」
      if (!armed) {
        armed = true;
        btn.textContent = '确认删除';
        btn.classList.add('armed');
        toast('再点一次确认删除', 'ok');
        timer = setTimeout(reset, 4000);   // 4 秒没点就恢复
        return;
      }

      // 第二次点：真正删除
      if (timer) { clearTimeout(timer); timer = null; }
      const gid = btn.getAttribute('data-group');
      const rid = Number(btn.getAttribute('data-room'));
      console.log('[relay] 删除规则', gid, rid);

      btn.disabled = true;
      btn.textContent = '删除中…';
      try {
        const r = await apiPost('relay-delete', { group: gid, roomId: rid });
        console.log('[relay] 删除响应', r);
        if (r && r.success === false) throw new Error(r.message || '删除失败');
        toast('已删除', 'ok');
        await load();
      } catch (e) {
        console.error('[relay] 删除失败', e);
        toast('删除失败：' + e.message, 'err');
        btn.disabled = false;
        reset();
      }
    });
  });
}

async function load() {
  try {
    const r = await apiGet('relay-list');
    if (!r || r.success === false) {
      throw new Error((r && r.message) || '读取失败');
    }
    current = r;
    const bits = [`共 ${r.total || 0} 条转发`];
    if (r.prefix === false) bits.push('房间前缀已关闭');
    if (r.giftMin > 0) bits.push(`礼物门槛 ¥${r.giftMin}`);
    $('#meta').textContent = bits.join(' · ');
    render();
  } catch (e) {
    $('#list').innerHTML = `
      <div class="empty">
        <b>读取失败</b>
        ${esc(e.message)}<br />
        请确认插件已启用「监听转发」
      </div>`;
  }
}

$('#refresh').addEventListener('click', async () => {
  $('#refresh').disabled = true;
  await load();
  $('#refresh').disabled = false;
  toast('已刷新', 'ok');
});

$('#copy-all').addEventListener('click', async () => {
  const ids = (current.groups || []).map((g) => g.group);
  if (!ids.length) return toast('没有可复制的群号', 'err');
  try {
    await navigator.clipboard.writeText(ids.join('\n'));
    toast('已复制 ' + ids.length + ' 个群号', 'ok');
  } catch {
    toast('复制失败', 'err');
  }
});

load();
</script>
</body>
</html>
